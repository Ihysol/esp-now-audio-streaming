board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv

; enable PSRAM usage
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEVICE_ROLE=ROLE_RECEIVER
monitor_speed = 115200 

